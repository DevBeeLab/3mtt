{% extends 'base.html' %}

{% block title %}Edit a Product{% endblock title %}

{% load static %}

{% block main %}
<div class="container">
    <h1>Edit Product</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
         <label for="name">Name</label><br>
        <input name="name" id="name" type="text" value="{{ product.name }}"><br>
        <label for="description">Description</label><br>
        <textarea name="description" id="description" cols="30" rows="10"  value="{{ product.description }}"></textarea><br>
        <label for="quantity">Quantity</label><br>
        <input name="quantity" id="quantity" type="number"  value="{{ product.quantity }}"><br>
        <label for="price">Price</label><br>
        <input name="price" id="price" type="number" step="0.01"  value="{{ product.price }}"><br>
        <label for="image">Image</label><br>
        <input name="image" id="image" type="file" value="{{ product.image }}"><br>

        <button type="submit" class="btn btn-primary">Save Changes</button>
    </form>
</div>
{% endblock main %}

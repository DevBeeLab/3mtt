{% extends 'base.html' %}


{% for msg in messages %}
    <p class="{{ msg.tag }}">{{ msg }}</p>
{% endfor %}
{% block main %}
    <h1>You can contact us from this page</h1>

    <form action="" method="post">
        {% csrf_token %}
        <label for="name">Name:</label><br>
        <input type="text" name="name" id="name"><br>
        <label for="email">Email:</label><br>
        <input type="email" name="email" id="email"><br>
        <label for="message">Message:</label><br>
        <textarea name="message" id="message" cols="30" rows="10" placeholder="write your message here..."></textarea><br>
        <button type="submit">Submit Message</button>
    </form>
{% endblock main %}
